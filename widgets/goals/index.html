<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Цели стрима</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;color:#fff;
  background:transparent;padding:14px}
.box{background:rgba(20,20,30,var(--widget-opacity,0.85));backdrop-filter:blur(8px);
  border-radius:12px;padding:14px 18px;
  box-shadow:0 4px 24px rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.08);max-width:420px}
.box.light{background:rgba(250,250,250,var(--widget-opacity,0.95));color:#222;
  border-color:rgba(0,0,0,0.08)}
h2{font-size:18px;margin-bottom:10px;color:#a78bfa;letter-spacing:0.5px}
.box.light h2{color:#7c3aed}
ul{list-style:none}
li{padding:6px 0;font-size:16px;transition:opacity 0.3s}
li .row{display:flex;align-items:center;gap:10px}
li.done .label{opacity:0.55;text-decoration:line-through;text-decoration-color:#888}
.label{flex:1}
.pct{font-size:13px;color:#aaa;min-width:38px;text-align:right}
.mark{display:inline-flex;width:22px;height:22px;border-radius:6px;
  border:2px solid #888;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;background:rgba(255,255,255,0.05)}
li.done .mark{background:#22c55e;border-color:#22c55e;color:#fff}
.gbar{margin-top:5px;height:6px;background:rgba(255,255,255,0.1);
  border-radius:3px;overflow:hidden}
.gbar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#22c55e);
  transition:width 0.5s}
.empty{font-size:14px;color:#888;padding:8px 0}
.error{font-size:13px;color:#fbbf24;padding:8px 0}
.progress{margin-top:10px;height:6px;background:rgba(255,255,255,0.1);
  border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#22c55e);
  transition:width 0.5s}
.summary{font-size:12px;color:#aaa;margin-top:6px}
.box.light .summary{color:#666}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
li.just-done .mark{animation:pop 0.4s ease}
/* §9.3: анимация «разлёта» при достижении цели (подтверждено владельцем 30.08) */
@keyframes confetti-fly{0%{transform:translate(0,0) rotate(0deg);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.confetti{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;
  z-index:9;animation:confetti-fly 1.1s ease-out forwards}
@keyframes glowbar{0%,100%{box-shadow:none}50%{box-shadow:0 0 16px 5px rgba(34,197,94,.85)}}
li.just-done .gbar-fill{animation:glowbar 1.1s ease}
/* §11.1: админ-режим ?admin=1 — клик-кнопки поверх OBS-превью */
.admin-btns{display:none;gap:6px;margin-left:8px}
body.admin .admin-btns{display:inline-flex}
body.admin{outline:2px dashed rgba(167,139,250,0.6);outline-offset:-4px}
.admin-btns button{width:28px;height:28px;border-radius:6px;border:none;
  background:rgba(167,139,250,0.9);color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;line-height:1}
.admin-btns button:active{transform:scale(0.92)}
</style></head><body>
<div class="box widget-theme-surface __THEME__" id="box">
  <h2 class="widget-theme-accent" id="title">__TITLE__</h2>
  <ul id="list"></ul>
  <div class="progress"><div class="progress-fill widget-theme-fill" id="bar"></div></div>
  <div class="summary widget-theme-muted" id="summary" role="status" aria-live="polite"></div>
</div>
<script>
WidgetI18n.add({
  ru: {
    'goals.title': 'Цели на стрим',
    'goals.unavailable': 'Цели недоступны (HTTP {status}).',
    'goals.empty': 'Нет целей. Добавь в панели.',
    'goals.summary': '{done} из {total} ({percent}%)',
    'goals.decrease': 'Уменьшить прогресс цели на 1%',
    'goals.increase': 'Увеличить прогресс цели на 1%',
    'goals.demo_followers': 'Собрать 50 фолловеров',
    'goals.demo_hours': 'Дожить до 4 часов эфира',
  },
  en: {
    'goals.title': 'Stream goals',
    'goals.unavailable': 'Goals unavailable (HTTP {status}).',
    'goals.empty': 'No goals. Add one in the panel.',
    'goals.summary': '{done} of {total} ({percent}%)',
    'goals.decrease': 'Decrease goal progress by 1%',
    'goals.increase': 'Increase goal progress by 1%',
    'goals.demo_followers': 'Reach 50 followers',
    'goals.demo_hours': 'Stream for 4 hours',
  },
  ua: {
    'goals.title': 'Цілі на стрім',
    'goals.unavailable': 'Цілі недоступні (HTTP {status}).',
    'goals.empty': 'Немає цілей. Додай у панелі.',
    'goals.summary': '{done} з {total} ({percent}%)',
    'goals.decrease': 'Зменшити прогрес цілі на 1%',
    'goals.increase': 'Збільшити прогрес цілі на 1%',
    'goals.demo_followers': 'Зібрати 50 фоловерів',
    'goals.demo_hours': 'Провести 4 години в ефірі',
  },
});
document.title = WidgetI18n.t('goals.title');
const heading = document.getElementById('title');
if (!heading.textContent) heading.textContent = WidgetI18n.t('goals.title');
// §11.0 WIDGETS_PLAN: адрес панели можно переопределить (?api=http://panel:8000);
const _WIDGET_API_BASE = new URLSearchParams(location.search).get('api') || '';

const qs=new URLSearchParams(location.search);
if(qs.get('admin')==='1')document.body.classList.add('admin');
const list=document.getElementById('list'),bar=document.getElementById('bar'),
      summary=document.getElementById('summary');
summary.textContent=WidgetI18n.t('common.loading');
function showGoalState(key, vars = {}) {
  list.replaceChildren();
  bar.style.width='0%';
  summary.textContent=WidgetI18n.t(key, vars);
}
let last=new Map();
const CONFETTI_COLORS=['#a78bfa','#22c55e','#fbbf24','#f472b6','#38bdf8','#fff'];
function celebrate(li){
  const rect=li.getBoundingClientRect();
  const cx=rect.left+26, cy=rect.top+rect.height/2;
  for(let i=0;i<16;i++){
    const p=document.createElement('div');p.className='confetti';
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70;
    p.style.left=cx+'px';p.style.top=cy+'px';
    p.style.background=CONFETTI_COLORS[i%CONFETTI_COLORS.length];
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy',(Math.sin(ang)*dist-30)+'px');
    p.style.setProperty('--rot',(Math.random()*540-270)+'deg');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1200);
  }
}
function stepGoal(id,delta){
  fetch(widgetScopedUrl(_WIDGET_API_BASE + '/api/widgets/goals/'+id+'/step'),{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({delta})})
    .then(load).catch(()=>{});
}
async function load(){
  try{
    const res=await fetch(widgetScopedUrl(_WIDGET_API_BASE + '/api/widgets/public/goals'));
    if(!res.ok){
      showGoalState('goals.unavailable', {status: res.status});return;
    }
    const data=await res.json();
    const items=data.items||[];
    if(!items.length){showGoalState('goals.empty');return;}
    render(items);
  }catch(e){
    showGoalState('common.disconnected');
  }
}
function render(items){
    list.innerHTML='';
    let sumPct=0,doneN=0;
    for(let it of items){
      const pct=Math.max(0,Math.min(100,parseInt(it.percent||0,10)||0));
      const wasDone=last.get(it.id);
      const li=document.createElement('li');
      if(pct>=100){li.classList.add('done');doneN++;
        if(wasDone!==undefined&&wasDone<100){li.classList.add('just-done');celebrate(li);}}
      const row=document.createElement('div');row.className='row';
      const mark=document.createElement('span');mark.className='mark';
      mark.textContent=pct>=100?'✓':'';
      const label=document.createElement('span');label.className='label widget-theme-text';
      label.textContent=(it.text||'');
      const pctEl=document.createElement('span');pctEl.className='pct widget-theme-muted';
      pctEl.textContent=pct+'%';
      row.appendChild(mark);row.appendChild(label);row.appendChild(pctEl);
      if(document.body.classList.contains('admin')){
        const btns=document.createElement('span');btns.className='admin-btns';
        const minus=document.createElement('button');minus.textContent='−';
        minus.setAttribute('aria-label', WidgetI18n.t('goals.decrease'));
        minus.onclick=()=>stepGoal(it.id,-1);
        const plus=document.createElement('button');plus.textContent='+';
        plus.setAttribute('aria-label', WidgetI18n.t('goals.increase'));
        plus.onclick=()=>stepGoal(it.id,1);
        btns.appendChild(minus);btns.appendChild(plus);row.appendChild(btns);
      }
      li.appendChild(row);
      const gbar=document.createElement('div');gbar.className='gbar';
      const fill=document.createElement('div');fill.className='gbar-fill widget-theme-fill';
      fill.style.width=pct+'%';gbar.appendChild(fill);
      li.appendChild(gbar);
      list.appendChild(li);
      last.set(it.id,pct);
      sumPct+=pct;
    }
    const pct=Math.round(sumPct/items.length);
    bar.style.width=pct+'%';
    summary.textContent=WidgetI18n.t('goals.summary', {done: doneN, total: items.length, percent: pct});
}
if(qs.get('preview')==='1'){
  // Представительная карточка: две цели, одна закрыта — видно и прогресс, и «done».
  document.body.style.background='#0f0f1a';
  render([{id:1,text:WidgetI18n.t('goals.demo_followers'),percent:64},{id:2,text:WidgetI18n.t('goals.demo_hours'),percent:100}]);
}else{
  load();setInterval(load,3000);
}
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/widget/sw.js',{scope:'/widget/'}).catch(()=>{});}</script></body></html>
