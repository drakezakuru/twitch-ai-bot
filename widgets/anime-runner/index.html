<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title data-widget-i18n="anime-runner.title">Аниме-бегун</title>
<style>
:root{color-scheme:dark}
:root{
  --hair:#f5f5f5;
  --hair-shade:#bfbfbf;
  --outfit:#3aa896;
  --outfit-shade:#1d6b5e;
  --accent:#ffaa44;
  --eye:#3a8fff;
  --skin:#ffe0c4;
  --skin-shade:#e8b894;
  --ear:#222;
  --ear-inner:#ff7eb9;
  --glove:#ffffff;
  --shoe:#ffffff;
  --shorts:#3aa896;
  --shorts-shade:#1d6b5e;
  --lane:480px;
  --char-h:160px;
}
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100vw;height:100vh;font-family:Arial,sans-serif}

/* ==== LANE MODE (corner) ==== */
.lane{position:fixed;width:var(--lane);height:var(--char-h);overflow:visible;pointer-events:none}
.lane.br{right:0;bottom:24px}
.lane.bl{left:0;bottom:24px}
.lane.tr{right:0;top:24px}
.lane.tl{left:0;top:24px}
.lane.size-S{--char-h:110px;--lane:340px}
.lane.size-M{--char-h:160px;--lane:480px}
.lane.size-L{--char-h:220px;--lane:620px}
.lane.size-XL{--char-h:280px;--lane:760px}

/* ==== PATH MODE (full viewport) ==== */
.lane.path-mode{width:100vw;height:100vh;left:0;top:0;right:auto;bottom:auto}
.lane.path-mode.size-S{--char-h:110px}
.lane.path-mode.size-M{--char-h:160px}
.lane.path-mode.size-L{--char-h:220px}
.lane.path-mode.size-XL{--char-h:280px}

.runner{position:absolute;bottom:0;left:0;height:var(--char-h);width:auto;will-change:transform;transform-origin:50% 100%}
.lane.path-mode .runner{bottom:auto;top:0}
.runner.flip svg,.runner.flip .photo{transform:scaleX(-1);transform-origin:50% 50%}
.runner svg{height:100%;display:block;overflow:visible}
.runner .photo{height:100%;width:auto;display:block;user-select:none;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}

/* ear toggle */
.runner.no-ears .ears{display:none}
/* gloves toggle */
.runner.no-gloves .glove{display:none}
.runner.gloves .hand-skin{display:none}

/* run cycle */
.runner.run .leg-left{animation:legL .42s ease-in-out infinite}
.runner.run .leg-right{animation:legR .42s ease-in-out infinite}
.runner.run .arm-left{animation:armL .42s ease-in-out infinite}
.runner.run .arm-right{animation:armR .42s ease-in-out infinite}
.runner.run .body{animation:bodyBob .42s ease-in-out infinite}
.runner.run .head{animation:bodyBob .42s ease-in-out infinite}
.runner.run .hair{animation:hairBob .42s ease-in-out infinite}
.runner.fast.run .leg-left,.runner.fast.run .leg-right,
.runner.fast.run .arm-left,.runner.fast.run .arm-right,
.runner.fast.run .body,.runner.fast.run .head,.runner.fast.run .hair{animation-duration:.32s}
.runner.turbo.run .leg-left,.runner.turbo.run .leg-right,
.runner.turbo.run .arm-left,.runner.turbo.run .arm-right,
.runner.turbo.run .body,.runner.turbo.run .head,.runner.turbo.run .hair{animation-duration:.22s}
.runner.slow.run .leg-left,.runner.slow.run .leg-right,
.runner.slow.run .arm-left,.runner.slow.run .arm-right,
.runner.slow.run .body,.runner.slow.run .head,.runner.slow.run .hair{animation-duration:.6s}

@keyframes legL{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes legR{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes armL{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-30deg)}}
@keyframes armR{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(20deg)}}
@keyframes bodyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hairBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}
.leg-left,.leg-right{transform-origin:50% 0%}
.arm-left,.arm-right{transform-origin:50% 0%}
.body,.hair{transform-origin:50% 100%}

.runner.idle .leg-left,.runner.idle .leg-right,
.runner.idle .arm-left,.runner.idle .arm-right{animation:none;transform:none}
.runner.idle .body{animation:idleBreath 3s ease-in-out infinite}
@keyframes idleBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

.runner.jump{animation:doJump .7s ease-out 1}
@keyframes doJump{0%{transform:translateY(0)}30%{transform:translateY(-70px)}55%{transform:translateY(0) scaleY(.92) scaleX(1.05)}80%{transform:translateY(-12px)}100%{transform:translateY(0)}}

.runner.wave .arm-right{animation:doWave 1.2s ease-in-out 1!important;transform-origin:50% 0%}
@keyframes doWave{0%,100%{transform:rotate(-150deg)}25%,75%{transform:rotate(-110deg)}50%{transform:rotate(-180deg)}}

.runner.spin{animation:doSpin .8s ease-in-out 1}
@keyframes doSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

.trail{position:absolute;bottom:6px;height:30px;background:linear-gradient(90deg,rgba(60,180,255,0),rgba(60,180,255,.5),rgba(60,180,255,0));border-radius:50%;filter:blur(4px);opacity:0;pointer-events:none}
.runner.boost ~ .trail{opacity:.85;animation:trailPulse 1s linear infinite}
@keyframes trailPulse{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.4)}}

.runner .pupil{animation:blink 5s infinite;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.05)}}

.runner.sleep{animation:none}
.runner.sleep .leg-left,.runner.sleep .leg-right,.runner.sleep .arm-left,.runner.sleep .arm-right,.runner.sleep .body,.runner.sleep .hair{animation:none}
.runner.sleep .pupil{display:none}
.runner.sleep .lid{display:block}
.runner.sleep .body{transform:translateY(8px) rotate(-3deg)}
.runner.sleep .head{transform:translate(2px,4px) rotate(-6deg);transform-origin:50% 100%}
.runner.sleep .leg-left{transform:rotate(-30deg)}
.runner.sleep .leg-right{transform:rotate(-20deg)}
.runner.sleep .arm-left{transform:rotate(-10deg)}
.runner.sleep .arm-right{transform:rotate(10deg)}
.runner .lid{display:none}


/* Photo-mode animations (photo is the whole character; per-part animations are no-ops) */
.runner .photo{transform-origin:50% 100%}
.runner.run .photo{animation:photoRun .42s ease-in-out infinite}
.runner.fast.run .photo{animation-duration:.32s}
.runner.turbo.run .photo{animation-duration:.22s}
.runner.slow.run .photo{animation-duration:.6s}
@keyframes photoRun{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.runner.idle .photo{animation:photoIdle 3s ease-in-out infinite}
@keyframes photoIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.runner.wave .photo{animation:photoWave 1.2s ease-in-out 1!important}
@keyframes photoWave{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) translateY(-2px)}50%{transform:rotate(6deg) translateY(-3px)}75%{transform:rotate(-3deg)}}
.runner.sleep .photo{transform:rotate(-12deg) translate(-4px,6px);animation:photoBreathe 4s ease-in-out infinite}
@keyframes photoBreathe{0%,100%{transform:rotate(-12deg) translate(-4px,6px)}50%{transform:rotate(-12deg) translate(-4px,4px)}}

/* fx */
.fx{position:absolute;font-size:26px;pointer-events:none;font-weight:900;text-shadow:0 0 6px rgba(0,0,0,.4)}
.fx.heart{animation:heartFly 1.6s ease-out forwards}
.fx.spark{animation:sparkFly 1.4s ease-out forwards}
.fx.bolt{animation:boltFly .8s ease-out forwards}
.fx.zZz{animation:zFly 2.4s ease-out infinite}
@keyframes heartFly{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-100px) scale(1.6)}}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--dx,40px),var(--dy,-50px)) scale(1.4) rotate(360deg)}}
@keyframes boltFly{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-60px) scale(1.6)}}
@keyframes zFly{0%{opacity:0;transform:translate(0,0) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(28px,-60px) scale(1.4)}}

.shadow{position:absolute;bottom:-2px;width:60px;height:8px;background:radial-gradient(ellipse at center,rgba(0,0,0,.45),rgba(0,0,0,0));pointer-events:none;animation:shadowPulse .42s ease-in-out infinite;left:50%;transform:translateX(-50%)}
.runner.idle ~ .shadow,.runner.sleep ~ .shadow{animation:none;opacity:.6}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(.9,.7)}}

.say{position:absolute;bottom:calc(var(--char-h) - 10px);background:rgba(255,255,255,var(--widget-opacity,1));color:#222;padding:6px 12px;border-radius:14px;font-size:14px;font-weight:700;white-space:nowrap;animation:sayPop .4s ease-out 1;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.say:after{content:'';position:absolute;bottom:-6px;left:14px;width:0;height:0;border:6px solid transparent;border-top-color:#fff}
[data-widget-theme] .say:after{border-top-color:var(--widget-theme-surface)}
@keyframes sayPop{0%{opacity:0;transform:scale(.4) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
</style></head>

// §11.0 WIDGETS_PLAN: адрес панели можно переопределить (?api=http://panel:8000);
const _WIDGET_API_BASE = new URLSearchParams(location.search).get('api') || '';

const CORNER_OV="__CORNER_OVERRIDE__";
const SPEED_OV="__SPEED_OVERRIDE__";
const SIZE_OV="__SIZE_OVERRIDE__";
const HAIR_OV="__HAIR_OVERRIDE__";
const OUTFIT_OV="__OUTFIT_OVERRIDE__";
const ACCENT_OV="__ACCENT_OVERRIDE__";
const EYE_OV="__EYE_OVERRIDE__";
const PATH_OV="__PATH_MODE_OVERRIDE__";

const lane=document.getElementById('lane');
const runner=document.getElementById('runner');
const shadow=document.getElementById('shadow');
const trail=document.getElementById('trail');

let cfg={
  hair_color:'#f5f5f5',outfit_color:'#3aa896',accent_color:'#ffaa44',eye_color:'#3a8fff',
  corner:'br',speed:'normal',size:'M',pause_chance:0.15,idle_timeout_sec:300,
  ears_enabled:1,ears_color:'#222',ears_inner_color:'#ff7eb9',
  gloves_enabled:0,gloves_color:'#ffffff',shoes_color:'#ffffff',
  shirt_pattern:'palm',shorts_color:'',
  path_mode:'lane',path_points:'[]',random_period_sec:90,
};
let pos=0,dir=1,running=true,boost=0;
const SPEED_MAP={slow:60,normal:130,fast:210,turbo:360};

// ---- Path mode state ----
let pathPx=[];           // array of {x, y} in pixels
let pathSegLen=[];       // array of segment lengths
let pathTotal=0;
let pathDist=0;          // distance along path
let pathDir=1;           // +1 forward, -1 reverse (only for ping-pong; default loop)
let randomGenAt=0;
let viewportW=window.innerWidth, viewportH=window.innerHeight;

function clamp(v,a,b){return Math.max(a,Math.min(v,b))}
function rnd(a,b){return a+Math.random()*(b-a)}

function shadeOf(hex,amt){
  // amt<0 darker, >0 lighter; simple HSL-like shift via multiply.
  if(!hex||hex.length<4) return hex;
  if(hex.length===4) hex='#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  const m=(c)=>clamp(Math.round(c+(255-c)*amt*(amt>0?1:0)+c*amt*(amt<0?1:0)),0,255);
  // simple darken (amt < 0): c = c*(1+amt), lighten: c = c+(255-c)*amt
  const f=(c)=>{
    if(amt<0) return clamp(Math.round(c*(1+amt)),0,255);
    return clamp(Math.round(c+(255-c)*amt),0,255);
  };
  const toHex=(c)=>c.toString(16).padStart(2,'0');
  return '#'+toHex(f(r))+toHex(f(g))+toHex(f(b));
}

function applyConfig(){
  // ---- Path mode classes ----
  const mode=PATH_OV||cfg.path_mode||'lane';
  const corner=CORNER_OV||cfg.corner||'br';
  const size=SIZE_OV||cfg.size||'M';
  if(mode==='custom'||mode==='random'){
    lane.className='lane path-mode size-'+size;
    runner.style.transition='';
    runner.style.bottom='';
  }else{
    lane.className='lane size-'+size+' '+corner;
    runner.style.top='';
    runner.style.bottom='0';
  }
  const speed=SPEED_OV||cfg.speed||'normal';
  runner.classList.remove('slow','fast','turbo');
  if(speed!=='normal') runner.classList.add(speed);

  // ears toggle
  if(cfg.ears_enabled) runner.classList.remove('no-ears'); else runner.classList.add('no-ears');
  // gloves toggle
  if(cfg.gloves_enabled){runner.classList.add('gloves');runner.classList.remove('no-gloves')}
  else{runner.classList.add('no-gloves');runner.classList.remove('gloves')}

  // colors
  const root=document.documentElement.style;
  root.setProperty('--hair', HAIR_OV||cfg.hair_color||'#f5f5f5');
  root.setProperty('--outfit', OUTFIT_OV||cfg.outfit_color||'#3aa896');
  root.setProperty('--outfit-shade', shadeOf(OUTFIT_OV||cfg.outfit_color||'#3aa896', -0.45));
  root.setProperty('--accent', ACCENT_OV||cfg.accent_color||'#ffaa44');
  root.setProperty('--eye', EYE_OV||cfg.eye_color||'#3a8fff');
  root.setProperty('--ear', cfg.ears_color||'#222');
  root.setProperty('--ear-inner', cfg.ears_inner_color||'#ff7eb9');
  root.setProperty('--glove', cfg.gloves_color||'#ffffff');
  root.setProperty('--shoe', cfg.shoes_color||'#ffffff');
  const sh=cfg.shorts_color||cfg.outfit_color||'#3aa896';
  root.setProperty('--shorts', sh);
  root.setProperty('--shorts-shade', shadeOf(sh, -0.45));

  // shirt pattern: swap fill of shirt parts
  const pattern=cfg.shirt_pattern||'palm';
  document.querySelectorAll('[data-shirt]').forEach(el=>{
    el.setAttribute('fill', shirtFillFor(pattern));
  });

  // Initialize path geometry if needed
  if(mode==='custom'){
    let pts=[];
    try{ pts=JSON.parse(cfg.path_points||'[]'); }catch(e){ pts=[]; }
    setPathFromNormalized(pts);
  }else if(mode==='random'){
    if(pathPx.length<2 || (Date.now()-randomGenAt)>(cfg.random_period_sec||90)*1000){
      generateRandomPath();
    }
  }
}

function shirtFillFor(pattern){
  if(pattern==='solid') return 'var(--outfit)';
  if(pattern==='stripes') return 'url(#stripesPat)';
  return 'url(#palmPat)';
}

// (data-shirt attribute is set in markup; JS only re-points fill on config change)

function laneWidth(){return lane.getBoundingClientRect().width}
function laneHeight(){return lane.getBoundingClientRect().height}
function runnerWidth(){return runner.getBoundingClientRect().width}
function runnerHeight(){return runner.getBoundingClientRect().height}

// ---- Path helpers ----
function rebuildPathLengths(){
  pathSegLen=[];pathTotal=0;
  for(let i=0;i<pathPx.length-1;i++){
    const dx=pathPx[i+1].x-pathPx[i].x, dy=pathPx[i+1].y-pathPx[i].y;
    const d=Math.sqrt(dx*dx+dy*dy);
    pathSegLen.push(d);pathTotal+=d;
  }
}
function setPathFromNormalized(pts){
  const w=window.innerWidth, h=window.innerHeight;
  pathPx=(pts||[]).filter(p=>Array.isArray(p)&&p.length>=2)
                  .map(p=>({x:clamp(p[0],0,1)*w, y:clamp(p[1],0,1)*h}));
  if(pathPx.length<2){pathPx=[];pathTotal=0;return}
  rebuildPathLengths();
  pathDist=clamp(pathDist,0,pathTotal);
}
function generateRandomPath(){
  const w=window.innerWidth, h=window.innerHeight;
  const margin={x:Math.min(80,w*0.05), y:Math.min(80,h*0.05)};
  const N=6+Math.floor(Math.random()*4); // 6..9 anchors
  const anchors=[];
  for(let i=0;i<N;i++){
    anchors.push({
      x:rnd(margin.x, w-margin.x),
      y:rnd(margin.y+h*0.2, h-margin.y),
    });
  }
  // Smoothify with Catmull-Rom-ish midpoint sampling.
  const dense=[];
  for(let i=0;i<anchors.length;i++){
    const p0=anchors[(i-1+anchors.length)%anchors.length];
    const p1=anchors[i];
    const p2=anchors[(i+1)%anchors.length];
    const p3=anchors[(i+2)%anchors.length];
    for(let t=0;t<1;t+=0.1){
      const t2=t*t, t3=t2*t;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      dense.push({x,y});
    }
  }
  pathPx=dense;
  rebuildPathLengths();
  pathDist=0;
  randomGenAt=Date.now();
}
function pointAtDistance(d){
  // Walk segments to find (x, y) and tangent.
  if(pathPx.length<2) return null;
  let rem=d, idx=0;
  while(idx<pathSegLen.length-1 && rem>pathSegLen[idx]){
    rem-=pathSegLen[idx]; idx++;
  }
  const p1=pathPx[idx], p2=pathPx[idx+1];
  const segL=pathSegLen[idx]||1e-6;
  const t=clamp(rem/segL,0,1);
  return {
    x:p1.x+(p2.x-p1.x)*t,
    y:p1.y+(p2.y-p1.y)*t,
    dx:(p2.x-p1.x)/segL, dy:(p2.y-p1.y)/segL,
  };
}

function setLanePos(x){
  // For lane mode, x is 'left' inside lane.
  runner.style.left=x+'px';
  runner.style.top='';
  shadow.style.left=(x+runnerWidth()/2)+'px';
  trail.style.left=(x-(dir>0?40:0))+'px';
  trail.style.width=runnerWidth()+'px';
  if(dir<0) runner.classList.add('flip'); else runner.classList.remove('flip');
}
function setPathPos(x,y,dirSign){
  // For path mode: position runner so feet align at (x,y).
  const rw=runnerWidth(), rh=runnerHeight();
  runner.style.left=(x-rw/2)+'px';
  runner.style.top=(y-rh)+'px';
  shadow.style.left=x+'px';
  shadow.style.top=(y-2)+'px';
  trail.style.left=(x-rw/2-(dirSign>0?40:0))+'px';
  trail.style.top=(y-rh*0.4)+'px';
  trail.style.width=rw+'px';
  if(dirSign<0) runner.classList.add('flip'); else runner.classList.remove('flip');
}

let last=performance.now();
function tick(now){
  const dt=Math.min((now-last)/1000,0.1);last=now;
  const mode=PATH_OV||cfg.path_mode||'lane';
  if(running && !runner.classList.contains('sleep')){
    const baseSpeed=SPEED_MAP[SPEED_OV||cfg.speed||'normal']||130;
    const eff=baseSpeed*(boost>0?2.2:1);
    if(mode==='custom'||mode==='random'){
      if(pathPx.length>=2){
        pathDist+=eff*dt;
        if(pathDist>=pathTotal) pathDist=pathDist-pathTotal; // loop
        const pt=pointAtDistance(pathDist);
        if(pt){
          const sgn=pt.dx>=0?1:-1;
          dir=sgn;
          setPathPos(pt.x, pt.y, sgn);
        }
      }
      // re-generate random path on schedule
      if(mode==='random'){
        if((Date.now()-randomGenAt)>(cfg.random_period_sec||90)*1000){
          generateRandomPath();
        }
      }
    }else{
      pos+=dir*eff*dt;
      const lw=laneWidth(),rw=runnerWidth();
      if(pos<=0){pos=0;dir=1}
      else if(pos+rw>=lw){pos=lw-rw;dir=-1}
      setLanePos(pos);
    }
  }
  if(boost>0){boost-=dt;if(boost<=0){boost=0;runner.classList.remove('boost')}}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

window.addEventListener('resize',()=>{
  viewportW=window.innerWidth; viewportH=window.innerHeight;
  const mode=PATH_OV||cfg.path_mode||'lane';
  if(mode==='custom'){
    let pts=[];try{pts=JSON.parse(cfg.path_points||'[]');}catch(e){}
    setPathFromNormalized(pts);
  }else if(mode==='random'){
    generateRandomPath();
  }
});

function setRun(){running=true;runner.classList.add('run');runner.classList.remove('idle','sleep');trail.style.opacity=boost>0?.85:0}
function setIdle(){running=false;runner.classList.remove('run');runner.classList.add('idle');runner.classList.remove('sleep');trail.style.opacity=0}
function setSleep(){running=false;runner.classList.remove('run');runner.classList.remove('idle');runner.classList.add('sleep');trail.style.opacity=0;spawnZ()}

let zTimer=null;
function spawnZ(){
  if(zTimer) return;
  zTimer=setInterval(()=>{
    if(!runner.classList.contains('sleep')){clearInterval(zTimer);zTimer=null;return}
    const z=document.createElement('div');z.className='fx zZz';
    z.textContent=['z','Z','zZz'][Math.floor(Math.random()*3)];
    const r=runner.getBoundingClientRect(); const lr=lane.getBoundingClientRect();
    z.style.left=((r.left-lr.left)+r.width/2+rnd(20,40))+'px';
    z.style.top=((r.top-lr.top)+10)+'px';
    lane.appendChild(z);setTimeout(()=>z.remove(),2400);
  },900);
}
function stopZ(){if(zTimer){clearInterval(zTimer);zTimer=null}}

function emit(kind,opts){
  opts=opts||{};
  const cls='fx '+(kind==='heart'?'heart':kind==='spark'?'spark':kind==='bolt'?'bolt':'heart');
  const count=opts.count||3;
  const r=runner.getBoundingClientRect(); const lr=lane.getBoundingClientRect();
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const e=document.createElement('div');e.className=cls;
      e.textContent=opts.text||(kind==='heart'?'❤️':kind==='spark'?'✨':kind==='bolt'?'⚡':'💎');
      e.style.left=((r.left-lr.left)+r.width/2+rnd(-20,20))+'px';
      e.style.top=((r.top-lr.top)+r.height*0.3)+'px';
      if(kind==='spark'){e.style.setProperty('--dx',rnd(-50,50)+'px');e.style.setProperty('--dy',rnd(-70,-30)+'px')}
      lane.appendChild(e);setTimeout(()=>e.remove(),1700);
    },i*120);
  }
}

function doSay(text){
  const s=document.createElement('div');s.className='say widget-theme-surface widget-theme-text';s.textContent=text;
  const r=runner.getBoundingClientRect(); const lr=lane.getBoundingClientRect();
  s.style.left=((r.left-lr.left)+r.width/2-30)+'px';
  s.style.top=((r.top-lr.top)-20)+'px';
  s.style.bottom='auto';
  lane.appendChild(s);setTimeout(()=>s.remove(),2400);
}

function doJump(){
  setRun();stopZ();
  runner.classList.remove('jump');void runner.offsetWidth;runner.classList.add('jump');
  setTimeout(()=>runner.classList.remove('jump'),700);
}
function doWave(){
  setIdle();stopZ();
  runner.classList.remove('wave');void runner.offsetWidth;runner.classList.add('wave');
  setTimeout(()=>{runner.classList.remove('wave');setRun()},1300);
}
function doSpin(){
  stopZ();
  runner.classList.remove('spin');void runner.offsetWidth;runner.classList.add('spin');
  setTimeout(()=>runner.classList.remove('spin'),800);
}
function doBoost(){
  stopZ();setRun();
  boost=5;runner.classList.add('boost');trail.style.opacity=.85;
}

function reactToEvent(ev){
  setRun();
  const k=(ev.kind||'').toLowerCase();
  const u=ev.username||'';
  if(k==='subscribe'||k==='sub'){
    doJump();emit('heart',{count:6});
    if(u)doSay('🎉 '+u+'!');
  }else if(k==='follow'){
    doWave();emit('heart',{count:2});
    if(u)doSay(wt('anime-runner.greeting',{user:u}));
  }else if(k==='cheer'){
    doSpin();emit('spark',{text:'💎',count:6});
    if(ev.amount)doSay(ev.amount+' bits!');
  }else if(k==='raid'){
    doBoost();emit('bolt',{count:5});
    if(u)doSay(wt('anime-runner.raid',{user:u}));
  }else{
    doJump();emit('spark',{count:3});
  }
}

function idleQuirk(){
  if(runner.classList.contains('sleep')||runner.classList.contains('jump')||runner.classList.contains('wave')) return;
  const r=Math.random();
  if(r<(cfg.pause_chance||0.15)*0.5){
    setIdle();setTimeout(()=>setRun(),1200+Math.random()*1500);
  }else if(r<(cfg.pause_chance||0.15)){
    doWave();
  }
}
setInterval(idleQuirk,5000);

applyConfig();
// Wave 6: цикл конфига/событий и sleep-по-idle — общие
// (_shared/character-core.js). Runner-рендер и его реакции остаются своими.
const characterLoop=CharacterCore.start({
  configUrl:'/api/widgets/public/anime-runner',
  onConfig:(c)=>{cfg=c;applyConfig()},
  onEvent:reactToEvent,
  onSleep:()=>{if(!runner.classList.contains('sleep'))setSleep()},
  eventsMs:2500,
});

window.runnerTest=function(kind){characterLoop.react({kind:kind||'subscribe',username:'test'})};
window.runnerRegenPath=function(){generateRandomPath()};
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/widget/sw.js',{scope:'/widget/'}).catch(()=>{});}</script></body></html>
