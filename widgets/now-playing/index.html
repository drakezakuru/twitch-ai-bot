<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title data-widget-i18n="now-playing.title">Сейчас играет</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:transparent;padding:12px}
.np{display:flex;align-items:center;gap:14px;
  background:rgba(20,20,30,var(--widget-opacity,0.85));backdrop-filter:blur(10px);
  border-radius:14px;padding:12px;color:#fff;
  box-shadow:0 4px 24px rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.08);max-width:520px;position:relative;
  transition:opacity 0.4s ease,transform 0.4s ease}
.np.light{background:rgba(250,250,250,var(--widget-opacity,0.95));color:#222;
  border-color:rgba(0,0,0,0.08)}
.np.hidden{opacity:0;transform:translateY(-10px) scale(0.95);pointer-events:none}
.cover{width:72px;height:72px;border-radius:10px;background:#1a1a2a;
  flex-shrink:0;background-size:cover;background-position:center;
  box-shadow:0 0 16px rgba(167,139,250,0.4);
  display:flex;align-items:center;justify-content:center;font-size:30px}
.info{flex:1;min-width:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
  color:#a78bfa;font-weight:600;margin-bottom:4px}
.np.light .label{color:#7c3aed}
.text{font-size:18px;font-weight:600;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word}
.subtext{font-size:13px;color:#aaa;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np.light .subtext{color:#666}
@keyframes equalizer{
  0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)}
}
.eq{display:inline-flex;gap:2px;height:14px;align-items:flex-end;
  margin-right:8px;vertical-align:-2px}
.eq span{width:3px;background:#a78bfa;border-radius:1px;display:block;
  height:100%;transform-origin:bottom;animation:equalizer 0.9s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:0.15s}
.eq span:nth-child(3){animation-delay:0.3s}
.eq span:nth-child(4){animation-delay:0.45s}
</style></head><body>
<div class="np widget-theme-surface __THEME__ hidden" id="np">
  <div class="cover" id="cover">🎵</div>
  <div class="info">
    <div class="label widget-theme-accent" id="label"><span class="eq"><span></span><span></span><span></span><span></span></span><span id="labelText">__TITLE__</span></div>
    <div class="text widget-theme-text" id="text">—</div>
    <div class="subtext widget-theme-muted" id="subtext"></div>
  </div>
</div>
<script>
WidgetI18n.add({
  "ru": {
    "now-playing.title": "Сейчас играет",
    "now-playing.now": "Сейчас",
    "now-playing.music": "Сейчас играет",
    "now-playing.video": "Сейчас смотрю",
    "now-playing.game": "Сейчас играю",
    "now-playing.podcast": "Сейчас слушаю",
    "now-playing.demo": "Демо-исполнитель · Пример трека",
    "now-playing.preview_data": "Демо-данные превью"
  },
  "en": {
    "now-playing.title": "Now playing",
    "now-playing.now": "Now",
    "now-playing.music": "Now playing",
    "now-playing.video": "Now watching",
    "now-playing.game": "Now gaming",
    "now-playing.podcast": "Now listening",
    "now-playing.demo": "Demo artist · Preview track",
    "now-playing.preview_data": "Preview demo data"
  },
  "ua": {
    "now-playing.title": "Зараз грає",
    "now-playing.now": "Зараз",
    "now-playing.music": "Зараз грає",
    "now-playing.video": "Зараз дивлюся",
    "now-playing.game": "Зараз граю",
    "now-playing.podcast": "Зараз слухаю",
    "now-playing.demo": "Демо-виконавець · Приклад треку",
    "now-playing.preview_data": "Демо-дані попереднього перегляду"
  }
});
const wt = (key, vars) => WidgetI18n.t(key, vars);

// §11.0 WIDGETS_PLAN: адрес панели можно переопределить (?api=http://panel:8000);
const _WIDGET_API_BASE = new URLSearchParams(location.search).get('api') || '';

const np=document.getElementById('np'),cover=document.getElementById('cover'),
      labelText=document.getElementById('labelText'),
      textEl=document.getElementById('text'),subtextEl=document.getElementById('subtext');
const KIND_ICONS={music:'🎵',video:'🎬',game:'🎮',movie:'🍿',podcast:'🎙️',custom:'✨'};
const KIND_LABELS={music:wt('now-playing.music'),video:wt('now-playing.video'),game:wt('now-playing.game'),movie:wt('now-playing.video'),podcast:wt('now-playing.podcast'),custom:wt('now-playing.now')};
const configuredTitle=new URLSearchParams(location.search).get('label')||labelText.textContent;
if(!configuredTitle.trim())labelText.textContent=wt('now-playing.now');
let lastKey='';
function apply(d){
    np.classList.remove('hidden');
    const key=d.kind+'|'+d.text+'|'+d.icon_url;
    if(key===lastKey)return;
    textEl.textContent=d.text;
    subtextEl.textContent=d.subtext||'';
    subtextEl.style.display=d.subtext?'block':'none';
    const baseTitle=configuredTitle;
    labelText.textContent = baseTitle && baseTitle.trim()
      ? baseTitle
      : (Object.hasOwn(KIND_LABELS,d.kind)?KIND_LABELS[d.kind]:KIND_LABELS.custom);
    if(d.icon_url){
      cover.style.backgroundImage='url('+d.icon_url+')';
      cover.textContent='';
    }else{
      cover.style.backgroundImage='';
      cover.textContent=Object.hasOwn(KIND_ICONS,d.kind)?KIND_ICONS[d.kind]:'✨';
    }
    lastKey=key;
}
async function poll(){
  try{
    const res=await fetch(widgetScopedUrl(_WIDGET_API_BASE + '/api/widgets/public/now-playing'));
    if(!res.ok){np.classList.add('hidden');return;}
    const d=await res.json();
    if(!d.playing||!d.text){np.classList.add('hidden');return;}
    apply(d);
  }catch(e){
    // Панель недоступна — прячем плашку, а не замораживаем прошлый трек в кадре.
    np.classList.add('hidden');
  }
}
if(new URLSearchParams(location.search).get('preview')==='1'){
  document.body.style.background='#0f0f1a';
  apply({kind:'music',text:wt('now-playing.demo'),subtext:wt('now-playing.preview_data'),icon_url:''});
}else{
  poll();setInterval(poll,3000);
}
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/widget/sw.js',{scope:'/widget/'}).catch(()=>{});}</script></body></html>
