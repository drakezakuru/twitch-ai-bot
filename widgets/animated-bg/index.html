<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Animated BG</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:color-mix(in srgb,__BG__ var(--widget-opacity-percent,100%),transparent)}
canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
.banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Segoe UI',system-ui,sans-serif;color:#fff;
  background:rgba(20,20,30,var(--widget-opacity,0.55));backdrop-filter:blur(8px);
  padding:18px 32px;border-radius:14px;font-size:42px;font-weight:700;
  text-shadow:0 4px 16px rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.1);letter-spacing:0.5px;
  white-space:pre-wrap;text-align:center;max-width:80vw}
.banner:empty{display:none}
</style></head><body><canvas id="c"></canvas><div class="banner widget-theme-surface widget-theme-text">__TITLE__</div><script>
// §11.0 WIDGETS_PLAN: адрес панели можно переопределить (?api=http://panel:8000);
const _WIDGET_API_BASE = new URLSearchParams(location.search).get('api') || '';

const TYPE="__TYPE__", SPEED=parseFloat("__SPEED__")||1.0, USER_COUNT=parseInt("__COUNT__",10)||0;
const USER_COLOR="__COLOR__";
// Browser Source в OBS рисует на каждом кадре сцены: неограниченная плотность
// частиц съедает FPS стрима, поэтому count ограничен сверху, а буфер канваса
// намеренно держится в CSS-пикселях (без множителя devicePixelRatio).
const MAX_COUNT=600;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',fit);fit();

const presets={
  snow:{count:200,color:'#ffffff'},
  stars:{count:300,color:'#ffffff'},
  fire:{count:120,color:''},
  rain:{count:300,color:'#aaccff'},
  embers:{count:80,color:''},
  matrix:{count:30,color:'#00ff88'}
};
const PRE=presets[TYPE]||presets.snow;
const COUNT=Math.min(MAX_COUNT,Math.max(1,USER_COUNT||PRE.count));
const COLOR=USER_COLOR||PRE.color;

let particles=[];
function rnd(a,b){return a+Math.random()*(b-a)}

function spawnSnow(){return {x:Math.random()*c.width,y:-10,r:rnd(1,4),vx:rnd(-0.3,0.3),vy:rnd(0.5,1.5)*SPEED,a:rnd(0.4,1)}}
function spawnStar(){return {x:Math.random()*c.width,y:Math.random()*c.height,r:rnd(0.5,2),tw:Math.random()*Math.PI*2}}
function spawnFire(){return {x:rnd(c.width*0.3,c.width*0.7),y:c.height+5,r:rnd(2,5),vy:rnd(-3,-1.5)*SPEED,vx:rnd(-0.5,0.5),life:rnd(40,120),age:0}}
function spawnRain(){return {x:Math.random()*c.width-100,y:-10,len:rnd(8,18),vx:5*SPEED,vy:rnd(12,18)*SPEED}}
function spawnEmber(){return {x:rnd(0,c.width),y:c.height+5,r:rnd(0.8,2.2),vx:rnd(-0.4,0.4),vy:rnd(-2,-0.6)*SPEED,life:rnd(80,200),age:0}}
function spawnMatrix(){return {x:Math.floor(Math.random()*(c.width/14))*14,y:rnd(-c.height,0),vy:rnd(2,6)*SPEED,len:Math.floor(rnd(8,25)),txt:Array.from({length:30},()=>String.fromCharCode(0x30A0+Math.floor(Math.random()*96)))}}

function init(){particles=[];for(let i=0;i<COUNT;i++){
  if(TYPE==='snow')particles.push(spawnSnow());
  else if(TYPE==='stars')particles.push(spawnStar());
  else if(TYPE==='fire')particles.push(spawnFire());
  else if(TYPE==='rain')particles.push(spawnRain());
  else if(TYPE==='embers')particles.push(spawnEmber());
  else if(TYPE==='matrix')particles.push(spawnMatrix());
}}
init();

function step(){
  if(TYPE==='matrix'){x.fillStyle='rgba(0,0,0,0.08)';x.fillRect(0,0,c.width,c.height);}
  else x.clearRect(0,0,c.width,c.height);

  if(TYPE==='snow'){
    for(let p of particles){
      x.beginPath();x.fillStyle='rgba(255,255,255,'+p.a+')';
      x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();
      p.x+=p.vx;p.y+=p.vy;p.x+=Math.sin(p.y/30)*0.3;
      if(p.y>c.height+10){p.x=Math.random()*c.width;p.y=-10;}
    }
  } else if(TYPE==='stars'){
    for(let p of particles){
      const tw=Math.sin(p.tw)*0.5+0.5;
      x.fillStyle='rgba(255,255,255,'+(0.3+0.7*tw)+')';
      x.beginPath();x.arc(p.x,p.y,p.r*(0.7+tw*0.6),0,Math.PI*2);x.fill();
      p.tw+=0.04*SPEED;
    }
  } else if(TYPE==='fire'){
    x.globalCompositeOperation='lighter';
    for(let p of particles){
      const t=p.age/p.life;
      if(t>=1){Object.assign(p,spawnFire());continue;}
      const r=Math.floor(255);
      const g=Math.floor(220-180*t);
      const b=Math.floor(40-40*t);
      x.fillStyle='rgba('+r+','+g+','+b+','+(1-t)+')';
      x.beginPath();x.arc(p.x,p.y,p.r*(1+t*1.5),0,Math.PI*2);x.fill();
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.age++;
    }
    x.globalCompositeOperation='source-over';
  } else if(TYPE==='rain'){
    x.strokeStyle=COLOR||'#aaccff';x.lineWidth=1.2;
    for(let p of particles){
      x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-p.vx*0.5,p.y-p.len);x.stroke();
      p.x+=p.vx;p.y+=p.vy;
      if(p.y>c.height){p.x=Math.random()*c.width-100;p.y=-10;}
    }
  } else if(TYPE==='embers'){
    x.globalCompositeOperation='lighter';
    for(let p of particles){
      const t=p.age/p.life;
      if(t>=1){Object.assign(p,spawnEmber());continue;}
      x.fillStyle='rgba(255,'+Math.floor(140-140*t)+',30,'+(1-t)+')';
      x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();
      p.x+=p.vx+Math.sin(p.age*0.05)*0.3;p.y+=p.vy;p.vy+=0.01;p.age++;
    }
    x.globalCompositeOperation='source-over';
  } else if(TYPE==='matrix'){
    x.font='14px monospace';
    for(let p of particles){
      for(let i=0;i<p.len;i++){
        const alpha=1-i/p.len;
        x.fillStyle='rgba(0,255,140,'+alpha+')';
        const ch=p.txt[(i+Math.floor(p.y/14))%p.txt.length];
        x.fillText(ch,p.x,p.y-i*14);
      }
      p.y+=p.vy;
      if(p.y-p.len*14>c.height){p.x=Math.floor(Math.random()*(c.width/14))*14;p.y=-20;}
    }
  }
  // prefers-reduced-motion: рисуем один статичный кадр вместо бесконечного цикла.
  if(!REDUCED)requestAnimationFrame(step);
}
step();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/widget/sw.js',{scope:'/widget/'}).catch(()=>{});}</script></body></html>
