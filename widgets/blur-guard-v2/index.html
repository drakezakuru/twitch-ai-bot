<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-widget-i18n="blur-guard-v2.title">Blur Guard v2 · Виджет OBS</title>
<style>
:root{color-scheme:dark}
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* ── Privacy mask. Browser Source cannot blur another OBS source. ── */
  #region {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    transition: backdrop-filter 0.35s ease, background-color 0.35s ease, opacity 0.35s ease;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    background: transparent;
    opacity: 0;
  }

  /* Always-on zones must hide every underlying pixel. */
  .zone-ao {
    position: absolute;
    pointer-events: none;
    background: rgb(15, 15, 25);
    z-index: 5;
  }

  #region.active {
    opacity: 1;
  }

  /* ── Status HUD ── */
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(15, 15, 25, var(--widget-opacity, 0.72));
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transform: translateY(0);
    transition: opacity 0.3s ease;
    z-index: 20;
    pointer-events: none;
    user-select: none;
  }

  #hud.hidden { opacity: 0; }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #555;
    box-shadow: 0 0 0 rgba(255, 60, 60, 0.5);
    transition: background 0.3s ease;
  }

  .dot.on {
    background: #ff3b3b;
    animation: pulse 1.4s infinite;
  }

  .dot.off { background: #3ddc84; }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(255, 59, 59, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0); }
  }

  #statusText { min-width: 34px; }

  #timer {
    font-variant-numeric: tabular-nums;
    color: #ffd166;
    display: none;
  }
  #timer.show { display: inline; }

  #modeBadge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(120, 130, 255, var(--widget-opacity, 0.25));
    color: #b8c0ff;
    text-transform: uppercase;
  }

  /* ── Feedback buttons ── */
  #feedback {
    position: absolute;
    bottom: 14px;
    left: 12px;
    display: flex;
    gap: 8px;
    z-index: 20;
  }

  #feedback button {
    pointer-events: auto;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: rgba(15, 15, 25, var(--widget-opacity, 0.72));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.12s ease, background 0.2s ease;
  }
  #feedback button:hover { transform: translateY(-2px); }
  #feedback button:active { transform: translateY(0); }
  #btnFalse:hover { background: rgba(255, 59, 59, var(--widget-opacity, 0.85)); }
  #btnMissed:hover { background: rgba(255, 179, 0, var(--widget-opacity, 0.85)); }
  #btnGood:hover  { background: rgba(61, 220, 132, var(--widget-opacity, 0.85)); }

  #feedback.hidden { display: none; }

  /* ── Панельное превью (?preview=1): подложка вместо камеры ──
     backdrop-filter нечего размывать в пустом Browser Source, поэтому
     в превью рисуем демо-кадр — видно и сам блюр, и зоны. */
  #demoScene {
    position: absolute; inset: 0; z-index: 0; display: none;
    background:
      radial-gradient(circle at 26% 42%, #a855f7 0 120px, transparent 121px),
      radial-gradient(circle at 74% 62%, #22d3ee 0 90px, transparent 91px),
      repeating-linear-gradient(45deg, #1f2937 0 18px, #111827 18px 36px);
  }
  .demo-secret {
    position: absolute; left: 11%; top: 45%;
    padding: 12px 16px; border-radius: 10px;
    color: #f8fafc; background: #312e81; font: 700 20px/1.3 monospace;
  }
  .demo-qr {
    position: absolute; right: 11%; top: 14%; width: 150px; height: 150px;
    border: 12px solid #fff;
    background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 / 22px 22px;
  }
  body.preview { background: rgba(15, 15, 26, var(--widget-opacity, 1)) !important; }
  body.preview #demoScene { display: block; }
  body.preview #region { z-index: 2; }

  /* connection indicator */
  #conn {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 6px;
    background: rgba(15, 15, 25, var(--widget-opacity, 0.6));
    color: #aaa;
    z-index: 20;
    pointer-events: none;
  }
  #conn.ok { color: #3ddc84; }
  #conn.bad { color: #ff6b6b; }
  [data-widget-theme] #hud,
  [data-widget-theme] #conn,
  [data-widget-theme] #feedback button:not(:hover) {
    background: color-mix(in srgb, var(--widget-theme-surface) var(--widget-opacity-percent, 100%), transparent);
    box-shadow: 0 4px 18px var(--widget-theme-shadow);
  }
  [data-widget-theme] #hud { color: var(--widget-theme-text); }
  [data-widget-theme] #modeBadge { color: var(--widget-theme-accent); }
</style>
</head>
<body>

<!-- SVG filters (gaussian + mosaic/displacement) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="bg-mosaic" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05"
                    numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap id="bg-disp" in="SourceGraphic" in2="noise"
                         scale="0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="demoScene">
  <div class="demo-secret" data-widget-i18n="blur-guard-v2.secret">Пароль: FAKE-QA-ONLY</div>
  <div class="demo-qr" aria-label="Тестовый узор, не настоящий QR-код" data-widget-i18n-aria-label="blur-guard-v2.qr"></div>
</div>
<div id="region"></div>

<div id="hud" class="hidden widget-theme-surface widget-theme-text">
  <span class="dot off" id="dot"></span>
  <span id="statusText" role="status" aria-live="polite"></span>
  <span id="timer">00:00</span>
  <span id="modeBadge" class="widget-theme-accent"></span>
</div>

<div id="conn" class="widget-theme-surface">…</div>

<div id="feedback" class="hidden">
  <button class="widget-theme-surface widget-theme-text" id="btnFalse" data-widget-i18n="blur-guard-v2.false">✖ Ложное срабатывание</button>
  <button class="widget-theme-surface widget-theme-text" id="btnMissed" data-widget-i18n="blur-guard-v2.missed">⚠ Пропуск</button>
  <button class="widget-theme-surface widget-theme-text" id="btnGood" data-widget-i18n="blur-guard-v2.good">✔ Верно</button>
</div>

<script>
WidgetI18n.add({
  "ru": {
    "blur-guard-v2.title": "Blur Guard v2 · Виджет OBS",
    "blur-guard-v2.on": "ВКЛ",
    "blur-guard-v2.off": "ВЫКЛ",
    "blur-guard-v2.ai": "ИИ",
    "blur-guard-v2.manual": "Вручную",
    "blur-guard-v2.persist": "Постоянно",
    "blur-guard-v2.mode": "Защита",
    "blur-guard-v2.source": "Источник: {source}",
    "blur-guard-v2.online": "● Подключено",
    "blur-guard-v2.offline": "● Нет связи",
    "blur-guard-v2.preview": "● Превью",
    "blur-guard-v2.false": "✖ Ложное срабатывание",
    "blur-guard-v2.missed": "⚠ Пропуск",
    "blur-guard-v2.good": "✔ Верно",
    "blur-guard-v2.secret": "Пароль: FAKE-QA-ONLY",
    "blur-guard-v2.qr": "Тестовый узор, не настоящий QR-код"
  },
  "en": {
    "blur-guard-v2.title": "Blur Guard v2 · OBS widget",
    "blur-guard-v2.on": "ON",
    "blur-guard-v2.off": "OFF",
    "blur-guard-v2.ai": "AI",
    "blur-guard-v2.manual": "Manual",
    "blur-guard-v2.persist": "Persistent",
    "blur-guard-v2.mode": "Protection",
    "blur-guard-v2.source": "Source: {source}",
    "blur-guard-v2.online": "● Connected",
    "blur-guard-v2.offline": "● Disconnected",
    "blur-guard-v2.preview": "● Preview",
    "blur-guard-v2.false": "✖ False positive",
    "blur-guard-v2.missed": "⚠ Missed detection",
    "blur-guard-v2.good": "✔ Correct",
    "blur-guard-v2.secret": "Password: FAKE-QA-ONLY",
    "blur-guard-v2.qr": "Test pattern, not a real QR code"
  },
  "ua": {
    "blur-guard-v2.title": "Blur Guard v2 · Віджет OBS",
    "blur-guard-v2.on": "УВІМК",
    "blur-guard-v2.off": "ВИМК",
    "blur-guard-v2.ai": "ШІ",
    "blur-guard-v2.manual": "Вручну",
    "blur-guard-v2.persist": "Постійно",
    "blur-guard-v2.mode": "Захист",
    "blur-guard-v2.source": "Джерело: {source}",
    "blur-guard-v2.online": "● Підключено",
    "blur-guard-v2.offline": "● Немає зв’язку",
    "blur-guard-v2.preview": "● Попередній перегляд",
    "blur-guard-v2.false": "✖ Хибне спрацювання",
    "blur-guard-v2.missed": "⚠ Пропущене виявлення",
    "blur-guard-v2.good": "✔ Правильно",
    "blur-guard-v2.secret": "Пароль: FAKE-QA-ONLY",
    "blur-guard-v2.qr": "Тестовий візерунок, не справжній QR-код"
  }
});
const wt = (key, vars) => WidgetI18n.t(key, vars);

(function () {
  "use strict";

  /* ───────────── URL params ───────────── */
  const qs = new URLSearchParams(location.search);
  // §11.0 WIDGETS_PLAN: адрес панели (?api=http://panel:8000) — совместимость с прологом других виджетов
  const _WIDGET_API_BASE = new URLSearchParams(location.search).get('api') || '';

  const CFG = {
    api:      qs.get("api") || (location.host || "localhost:8080"),
    mode:     (qs.get("mode") || "ai").toLowerCase(),        // ai | manual
    blur:     clamp(parseInt(qs.get("blur"), 10) || 60, 1, 100),
    scale:    parseFloat(qs.get("scale")) || 1,
    channel:  qs.get("channel") || "",
    // v2
    blurMode: (qs.get("blurmode") || "gaussian").toLowerCase(), // gaussian|mosaic|combo
    region:   qs.get("region") || "",                        // x,y,w,h
  zones:    qs.get("zones") || "",                        // P4: "x,y,w,h;x,y,w,h" (px или %) — always-on блюр 100%
    persistent: qs.get("persistent") === "1" || qs.get("persistent") === "true",
    cleanFrames: parseInt(qs.get("clean"), 10) || 5,
    hud:      qs.get("hud") !== "0",
    fb:       qs.get("feedback") !== "0",
  };

  const MAX_DURATION_MS = 10 * 60 * 1000; // 10 min cap

  /* ───────────── DOM refs ───────────── */
  const region    = document.getElementById("region");
  const hud       = document.getElementById("hud");
  const dot       = document.getElementById("dot");
  const statusTxt = document.getElementById("statusText");
  const timerEl   = document.getElementById("timer");
  const modeBadge = document.getElementById("modeBadge");
  const connEl    = document.getElementById("conn");
  const feedback  = document.getElementById("feedback");
  const dispNode  = document.getElementById("bg-disp");

  /* ───────────── State ───────────── */
  const state = {
    active: false,
    blurMode: CFG.blurMode,
    blurPercent: CFG.blur,
    coverPercent: CFG.blur,
    protectionMode: "mask",
    coverImageUrl: "/api/widgets/public/blur-guard/image",
    persistent: CFG.persistent,
    deadline: 0,          // timestamp when blur must auto-clear
    timerHandle: null,
    countdownHandle: null,
  };

  /* ───────────── Init UI ───────────── */
  document.body.style.transform = `scale(${CFG.scale})`;
  document.body.style.transformOrigin = "top left";

  if (CFG.hud) hud.classList.remove("hidden");
  if (CFG.fb)  feedback.classList.remove("hidden");
  modeBadge.textContent = modeLabel(CFG.persistent ? "persist" : CFG.mode);

  applyRegion(CFG.region);

  /* ───────────── P4: always-on зоны (мультизоны, блюр всегда 100%) ───────────── */
  function parseZones(str) {
    return (str || "").split(";").map(s => s.trim()).filter(Boolean).map(z => {
      const p = z.split(",").map(v => v.trim());
      if (p.length !== 4) return null;
      const num = v => {
        if (v.endsWith("%")) { const f = parseFloat(v); return isNaN(f) ? null : { pct: f }; }
        const f = parseFloat(v); return isNaN(f) ? null : { px: f };
      };
      const [x, y, w, h] = p.map(num);
      if (!x || !y || !w || !h) return null;
      return { x, y, w, h };
    }).filter(Boolean);
  }

  function applyZones(zonesStr) {
    document.querySelectorAll(".zone-ao").forEach(el => el.remove());
    parseZones(zonesStr).forEach(z => {
      const el = document.createElement("div");
      el.className = "zone-ao";
      const set = (prop, v) => { el.style[prop] = (v.pct != null ? v.pct + "%" : v.px + "px"); };
      set("left", z.x); set("top", z.y); set("width", z.w); set("height", z.h);
      document.body.appendChild(el);
    });
  }
  applyZones(CFG.zones);

  /* ───────────── Region masking ───────────── */
  function applyRegion(regionStr) {
    if (!regionStr) {
      region.style.top = "0";
      region.style.left = "0";
      region.style.width = "100%";
      region.style.height = "100%";
      region.style.webkitMaskImage = "none";
      region.style.maskImage = "none";
      return;
    }
    const parts = regionStr.split(",").map(n => parseFloat(n.trim()));
    if (parts.length === 4 && parts.every(v => !isNaN(v))) {
      const [x, y, w, h] = parts;
      region.style.left = x + "px";
      region.style.top = y + "px";
      region.style.width = w + "px";
      region.style.height = h + "px";
    }
  }

  /* ───────────── Blur filter builder ───────────── */
  function computeBlur(percent) {
    const p = clamp(percent, 1, 100) / 100;
    // gaussian: up to ~24px
    const gaussPx = (p * 24).toFixed(2);
    // mosaic: displacement scale up to ~40
    const dispScale = (p * 40).toFixed(1);

    let filter = "";
    switch (state.blurMode) {
      case "mosaic":
        dispNode.setAttribute("scale", dispScale);
        filter = "url(#bg-mosaic)";
        break;
      case "combo":
        dispNode.setAttribute("scale", (dispScale * 0.6).toFixed(1));
        filter = `blur(${(gaussPx * 0.7).toFixed(2)}px) url(#bg-mosaic)`;
        break;
      case "gaussian":
      default:
        filter = `blur(${gaussPx}px)`;
        break;
    }
    return filter;
  }

  function paintBlur() {
    region.style.backgroundImage = "none";
    if (state.protectionMode === "image") {
      region.style.backdropFilter = "none";
      region.style.webkitBackdropFilter = "none";
      region.style.backgroundColor = "rgb(15, 15, 25)";
      region.style.backgroundImage = `url(${state.coverImageUrl}?v=${Date.now()})`;
      region.style.backgroundSize = "cover";
      region.style.backgroundPosition = "center";
      return;
    }
    if (state.protectionMode === "obs_filter") {
      region.style.backdropFilter = "none";
      region.style.webkitBackdropFilter = "none";
      region.style.backgroundColor = "transparent";
      return;
    }
    const f = computeBlur(state.blurPercent);
    region.style.backdropFilter = f;
    region.style.webkitBackdropFilter = f;
    region.style.backgroundColor = `rgba(15, 15, 25, ${state.coverPercent / 100})`;
  }

  /* ───────────── Activate / Deactivate ───────────── */
  function activateBlur(opts) {
    opts = opts || {};
    if (opts.blur_percent != null) state.blurPercent = clamp(opts.blur_percent, 1, 100);
    if (opts.cover_percent != null) state.coverPercent = clamp(opts.cover_percent, 1, 100);
    else if (opts.blur_percent != null) state.coverPercent = state.blurPercent;
    if (opts.blur_mode) state.blurMode = opts.blur_mode;
    state.persistent = (opts.mode === "persistent") || CFG.persistent || !!opts.persistent;
  
    paintBlur();
    region.classList.add("active");
    state.active = true;

    // duration handling
    clearTimeout(state.timerHandle);
    let dur = opts.duration != null ? Number(opts.duration) : 0;
    // duration may be seconds — normalize to ms if small
    if (dur > 0 && dur < 1000) dur = dur * 1000;

    if (state.persistent) {
      // persistent: capped by MAX_DURATION, cleared by clean frames / blur_off
      state.deadline = Date.now() + MAX_DURATION_MS;
      state.timerHandle = setTimeout(() => deactivateBlur("timeout"), MAX_DURATION_MS);
    } else if (dur > 0) {
      const capped = Math.min(dur, MAX_DURATION_MS);
      state.deadline = Date.now() + capped;
      state.timerHandle = setTimeout(() => deactivateBlur("duration"), capped);
    } else {
      state.deadline = 0;
    }

    updateHud(true, opts.source);
    startCountdown();
  }

  function deactivateBlur(reason) {
    state.active = false;
    state.deadline = 0;
      clearTimeout(state.timerHandle);
    stopCountdown();
    region.classList.remove("active");
    region.style.backdropFilter = "none";
    region.style.webkitBackdropFilter = "none";
    region.style.backgroundColor = "transparent";
    updateHud(false);
  }

  // P8-B5: reportCleanFrame/reportDirtyFrame удалены вместе с dead-подписками
  // (бэкенд-цикл сам решает blur_on/blur_off, клиентские счётчики не нужны).

  /* ───────────── HUD & Countdown ───────────── */
  function modeLabel(mode) { return wt('blur-guard-v2.'+(['ai','manual','persist'].includes(mode)?mode:'mode')); }
  function updateHud(on, source) {
    dot.classList.toggle("on", on);
    dot.classList.toggle("off", !on);
    statusTxt.textContent = wt(on ? 'blur-guard-v2.on' : 'blur-guard-v2.off');
    modeBadge.textContent = modeLabel(state.persistent ? "persist" : CFG.mode);
    modeBadge.title = on && source ? wt('blur-guard-v2.source',{source:source === 'preview' ? wt('common.preview') : modeLabel(source)}) : '';
  }

  function startCountdown() {
    stopCountdown();
    if (!state.deadline) { timerEl.classList.remove("show"); return; }
    timerEl.classList.add("show");
    const tick = () => {
      const remaining = state.deadline - Date.now();
      if (remaining <= 0) { timerEl.textContent = "00:00"; return; }
      const s = Math.ceil(remaining / 1000);
      const mm = String(Math.floor(s / 60)).padStart(2, "0");
      const ss = String(s % 60).padStart(2, "0");
      timerEl.textContent = mm + ":" + ss;
    };
    tick();
    state.countdownHandle = setInterval(tick, 250);
  }
  function stopCountdown() {
    clearInterval(state.countdownHandle);
    state.countdownHandle = null;
    timerEl.classList.remove("show");
  }

  /* ───────────── Config apply ───────────── */
  function applyConfig(cfg) {
    if (!cfg) return;
    if (cfg.blur_mode && !qs.has("blurmode")) state.blurMode = String(cfg.blur_mode).toLowerCase();
    if (cfg.region != null && !qs.has("region")) applyRegion(cfg.region);
    if (cfg.consecutive_clean_frames != null) {
      const n = parseInt(cfg.consecutive_clean_frames, 10);
      // P8-B5: consecutiveClean использовался только удалёнными
      // clean/dirty-frame счётчиками — из конфига больше не читаем.
    }
    if (cfg.blur_percent != null && !qs.has("blur")) state.blurPercent = clamp(cfg.blur_percent, 1, 100);
    if (cfg.cover_percent != null && !qs.has("blur")) state.coverPercent = clamp(cfg.cover_percent, 1, 100);
    else if (cfg.blur_percent != null && !qs.has("blur")) state.coverPercent = state.blurPercent;
    if (state.active) paintBlur();
    if (cfg.persistent != null) state.persistent = !!cfg.persistent;
    if (cfg.protection_mode) state.protectionMode = cfg.protection_mode;
    if (cfg.cover_image_url) state.coverImageUrl = cfg.cover_image_url;
  }

  /* ───────────── WebSocket ───────────── */
  let ws = null;
  let reconnectDelay = 1000;

  function wsUrl() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    return `${proto}://${CFG.api}/ws`;
  }

  function connect() {
    try { ws = new WebSocket(wsUrl()); }
    catch (e) { scheduleReconnect(); return; }

    ws.onopen = () => {
      reconnectDelay = 1000;
      connEl.textContent = wt('blur-guard-v2.online');
      connEl.className = "ok";
      // announce presence (backward-compatible; server may ignore)
      safeSend({
        type: "hello",
        widget: "blur-guard-v2",
        channel: CFG.channel,
        mode: CFG.mode,
      });
      syncRuntimeState();
    };

    ws.onmessage = (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }
      handleMessage(msg);
    };

    ws.onclose = () => {
      connEl.textContent = wt('blur-guard-v2.offline');
      connEl.className = "bad";
      scheduleReconnect();
    };

    ws.onerror = () => { try { ws.close(); } catch {} };
  }

  function scheduleReconnect() {
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.7, 15000);
  }

  function safeSend(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify(obj)); } catch {}
    }
  }

  function httpApiBase() {
    const raw = qs.get("api");
    if (!raw) return location.origin;
    if (/^https?:\/\//i.test(raw)) return raw.replace(/\/$/, "");
    return `${location.protocol}//${raw.replace(/\/$/, "")}`;
  }

  async function syncRuntimeState() {
    try {
      const response = await fetch(`${httpApiBase()}/api/widgets/public/blur-guard/state`, { cache: "no-store" });
      if (!response.ok) return;
      const current = await response.json();
      applyConfig(current);
      if (current.always_zones !== undefined && !CFG.zones) applyZones(current.always_zones);
      if (current.blur) activateBlur(current);
      else deactivateBlur("sync");
    } catch {}
  }

  /* ───────────── Message dispatch (v2 + legacy) ───────────── */
  function handleMessage(msg) {
    // Legacy shape: { type: "blur_on" } OR { event: "blur_on" }
    const kind = msg.type || msg.event || (msg.blur_guard && msg.blur_guard.event);

    // Nested v2 payloads: { type:"blur_guard", kind:"blur_on", ... }
    // Бэкенд (app/blur_guard.py::_broadcast) кладёт внутреннее событие в `kind`.
    if (msg.type === "blur_guard") {
      const ev = msg.kind || msg.event;
      routeEvent(ev, msg);
      return;
    }

    routeEvent(kind, msg);
  }

  function routeEvent(kind, msg) {
    switch (kind) {
      case "blur_on":
        applyConfig(msg);
        if (msg.always_zones !== undefined && !CFG.zones) applyZones(msg.always_zones);
        activateBlur({
          blur_percent: pick(msg, "blur_percent", "blur", "percent"),
          cover_percent: pick(msg, "cover_percent", "blur_percent", "blur", "percent"),
          duration:     pick(msg, "duration"),
          source:       pick(msg, "source"),
          mode:         pick(msg, "mode"),
          blur_mode:    pick(msg, "blur_mode"),
          persistent:   pick(msg, "persistent"),
        });
        break;

      case "blur_off":
        deactivateBlur("server");
        break;

      case "blur_config":
        applyConfig({
          blur_mode: pick(msg, "blur_mode"),
          region: pick(msg, "region"),
          consecutive_clean_frames: pick(msg, "consecutive_clean_frames"),
          blur_percent: pick(msg, "blur_percent"),
          cover_percent: pick(msg, "cover_percent", "blur_percent"),
          persistent: pick(msg, "persistent"),
        });
        // P4/P8-W1: обновление always-on зон (always_zones: "x,y,w,h;..." | "")
        if (msg.always_zones !== undefined && !CFG.zones) applyZones(msg.always_zones);
        break;

      // P8-B5: dead-подписки clean_frame/dirty_frame удалены — бэкенд
      // blur_on/blur_off решает сам, эти кейсы никогда не приходили.

      default:
        // ignore unrelated messages for forward-compat
        break;
    }
  }

  function pick(obj, ...keys) {
    for (const k of keys) if (obj[k] !== undefined) return obj[k];
    return undefined;
  }

  /* ───────────── Feedback buttons ───────────── */
  document.getElementById("btnFalse").onclick  = () => sendFeedback("false_positive");
  document.getElementById("btnMissed").onclick = () => sendFeedback("missed");
  document.getElementById("btnGood").onclick   = () => sendFeedback("correct");

  function sendFeedback(kind) {
    safeSend({
      type: "blur_guard",
      event: "feedback",
      feedback: kind,
      channel: CFG.channel,
      blur_percent: state.blurPercent,
      blur_mode: state.blurMode,
      active: state.active,
      ts: Date.now(),
    });
    flash(kind);
  }

  function flash(kind) {
    const map = { false_positive: "#ff3b3b", missed: "#ffb300", correct: "#3ddc84" };
    hud.style.boxShadow = `0 0 0 2px ${map[kind] || "#fff"}, 0 4px 18px rgba(0,0,0,0.4)`;
    setTimeout(() => { hud.style.boxShadow = ""; }, 500);
  }

  /* ───────────── Utils ───────────── */
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /* ───────────── Boot ───────────── */
  updateHud(false);
  if (qs.get("preview") === "1") {
    // Превью не открывает WS: панель показывает представительное включённое
    // состояние. Region ограничен половиной кадра, иначе размывается всё и
    // «до/после» не читается.
    document.body.classList.add("preview");
    connEl.textContent = wt('blur-guard-v2.preview');
    connEl.className = "ok";
    if (!CFG.region) { region.style.width = "50%"; }
    if (!CFG.zones) applyZones("62%,8%,32%,34%");
    activateBlur({ blur_percent: state.blurPercent, cover_percent: state.coverPercent, blur_mode: state.blurMode, persistent: true });
    updateHud(true, "preview");
  } else {
    connect();
  }

  // expose for manual/testing via OBS interact
  window.BlurGuard = {
    on: (o) => activateBlur(o || {}),
    off: () => deactivateBlur("manual"),
    config: applyConfig,
    state,
  };
})();
</script>
</body>
</html>
